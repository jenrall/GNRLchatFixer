# ===== ChatFixer Config =====

# Time (in seconds) during which duplicate server messages are blocked.
duplicate-window-seconds: 10

# Block ALL console messages from reaching chat.
block-console-messages: true

# Sender names that are treated as console / server.
console-sender-names:
  - ""
  - "CONSOLE"
  - "Console"
  - "console"
  - "Server"
  - "SERVER"
  - "System"
  - "SYSTEM"

# Regex patterns to block specific server messages.
blocked-patterns:
  # - "/^\[Server\]/i"
