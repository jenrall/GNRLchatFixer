# ===== ChatFixer Config =====

# زمان (به ثانیه) که پیام تکراری سرور توش مسدود میشه
# اگه کنسول هر 10 ثانیه پیام بفرسته، این رو 15 یا بیشتر بذار
duplicate-window-seconds: 10

# مسدود کردن کامل پیام‌های کنسول
# true = همه پیام‌های کنسول مسدود بشن (چیزی از کنسول تو چت نمیاد)
# false = فقط پیام‌های تکراری کنسول مسدود بشن
block-console-messages: true

# اسم‌هایی که به عنوان کنسول/سرور شناسایی میشن
# اگه پلاگین خاصی اسم دیگه‌ای استفاده می‌کنه، اینجا اضافه کن
console-sender-names:
  - ""
  - "CONSOLE"
  - "Console"
  - "console"
  - "Server"
  - "SERVER"
  - "System"
  - "SYSTEM"

# الگوهای Regex برای مسدود کردن پیام‌های خاص
# فقط روی پیام‌های سرور/کنسول اعمال میشه
blocked-patterns:
  # - "/^\[Server\]/i"
