# الگوهای Regex برای مسدود کردن پیام‌ها
# هر پیامی که با این الگوها مطابقت داشته باشه، مسدود میشه
blocked-patterns:
  - "/^§[0-9a-fk-or]/i"

# زمان (به ثانیه) که پیام تکراری توش مسدود میشه
duplicate-window-seconds: 5

# تعداد پیام تکراری مجاز در بازه زمانی
max-duplicates: 1

# مسدود کردن پیام‌های خودکار تکراری سرور
block-repeated-auto-messages: true
