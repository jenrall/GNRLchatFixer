name: Build ChatFixer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build PHAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, zip, yaml
          coverage: none

      - name: Download DevTools source
        run: |
          git clone --depth 1 https://github.com/pmmp/DevTools.git /tmp/DevTools
          ls -la /tmp/DevTools/
          ls -la /tmp/DevTools/src/

      - name: Prepare plugin folder
        run: |
          mkdir -p /tmp/build/ChatFixer
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='pmmp' \
            --exclude='*.phar' \
            ./ /tmp/build/ChatFixer/
          echo "=== Files ready ==="
          ls -la /tmp/build/ChatFixer/

      - name: Build PHAR with ConsoleScript
        run: |
          cd /tmp/DevTools
          php -dphar.readonly=0 src/ConsoleScript.php \
            --make /tmp/build/ChatFixer \
            --out /tmp/build/ChatFixer.phar
          echo "=== Build result ==="
          ls -la /tmp/build/

      - name: Upload PHAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatFixer-PHAR
          path: /tmp/build/ChatFixer.phar
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/build/ChatFixer.phar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
